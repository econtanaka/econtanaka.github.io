bio: |
  I am an Associate Professor of Economics at the University of Queensland.
  My research lies at the intersection of **macroeconomics** and
  **labor economics**, with a focus on occupational dynamics, skill
  mismatch, intergenerational mobility, and structural transformation.

  I received my Ph.D. in Economics from the University of Minnesota.
  My work has been published in the *Journal of International Economics*,
  the *Journal of Monetary Economics*, and the *American Economic Journal:
  Macroeconomics*, among others, and is supported by the Australian
  Research Council.

